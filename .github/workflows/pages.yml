name: Test og GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-tests
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Byg webside
        run: ./web/byg_side.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test femdoc i Pyodide (samme kode som websiden)
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node test_pyodide.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
